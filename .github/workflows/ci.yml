name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # sm-dat 0.3.0 pins sm-arp>=0.4.0, which is merged on sm-arp master but not
      # yet published to PyPI (latest there: 0.3.4). Install it from the merged
      # SHA first so the editable install below resolves; drop this step once
      # sm-arp 0.4.0 is on PyPI.
      - name: Install sm-arp 0.4.0 (merged SHA; not yet on PyPI)
        run: pip install "sm-arp @ git+https://github.com/Sharathvc23/sm-arp@f182c0c07556147d57548945f1a3b00088138aad"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Conformance corpus
        run: python -m pytest -q
      - name: Examples run
        run: |
          python examples/grant_and_verify.py
          python examples/budget_and_indeterminate.py
          python examples/arp_bridge.py
      - name: Vectors are reproducible
        run: |
          python vectors/_generate.py
          git diff --exit-code vectors/ || (echo "::error::vectors/ drifted from generator — re-run vectors/_generate.py and commit" && exit 1)
