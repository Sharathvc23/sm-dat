[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-dat"
version = "0.3.0"
description = "Delegated Authority Token — the principal-signed grant defining what an AI agent is allowed to do. Companion to sm-arp (ARP)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StellarMinds", email = "hello@stellarminds.ai" }]
keywords = ["ai-agents", "authorization", "delegation", "nanda", "arp", "accountability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "sm-arp>=0.4.0",
    "jcs",
    "cryptography",
    "base58",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Sharathvc23/sm-dat"
Spec = "https://github.com/Sharathvc23/sm-dat/blob/master/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["sm_dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
